# Local smoke-test configuration using data/raw/demo_interactions.csv.
# The generated data is synthetic and must not be used for performance claims.
data:
  source_format: canonical_csv
  raw_path: data/raw/netflix_titles.csv
  processed_dir: data/processed/demo
  validation_fraction: 0.10
  test_fraction: 0.10
  rating_min: 1.0
  rating_max: 5.0
seed: 42
models:
  popularity:
    regularization: 20.0
    min_item_ratings: 2
  collaborative_filtering:
    neighborhood_size: 20
    min_item_ratings: 2
  matrix_factorization:
    factors: 16
    epochs: 10
    learning_rate: 0.01
    regularization: 0.05
  neural_collaborative_filtering:
    embedding_dim: 16
    mlp_layers: [32, 16]
    epochs: 5
    batch_size: 64
    learning_rate: 0.001
    negative_samples_per_positive: 1
    implicit_positive_rating: 4.0
artifacts:
  model_path: models/recommender_bundle.joblib
evaluation:
  recommendation_k: 5
  relevant_rating_min: 4.0
  results_dir: models/evaluations/demo
